

services:
  # 1. Relational Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: beerenberg-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "Yul4ndKen 10"
      MYSQL_DATABASE: beerenberg_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/backups:/var/backups/beerenberg
    networks:
      - beerenberg_network

  # 2. Core Backend API Service (Express API)
  backend:
    build: ./backend
    container_name: beerenberg-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: beerenberg_db
      DB_USER: root
      DB_PASSWORD: "Yul4ndKen 10"
      JWT_SECRET: production_super_secret_jwt_key
      JWT_EXPIRES_IN: 8h
    depends_on:
      - db
    networks:
      - beerenberg_network

  # 3. Office Admin & Rostering Portal (React + Nginx)
  frontend-admin:
    build: ./frontend-admin
    container_name: beerenberg-admin-ui
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - beerenberg_network

  # 4. Time Station Kiosk UI (React + Nginx)
  frontend-kiosk:
    build: ./frontend-kiosk
    container_name: beerenberg-kiosk-ui
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - beerenberg_network

volumes:
  db_data:

networks:
  beerenberg_network:
    driver: bridge